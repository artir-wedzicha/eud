  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/crypto-js.js"></script>
  <script type="text/javascript">
  function jsUcfirst(string) {
      return string.charAt(0).toUpperCase() + string.slice(1);
  }


  function Base64EncodeUrl(str){
      return str.replace(/\+/g, '-').replace(/\//g, '_').replace(/\=+$/, '');
  }

  function generate_jwt_token(payload, api_key) {
      const HMACSHA256 = (stringToSign, secret) => {
          var hash = CryptoJS.HmacSHA256(stringToSign, secret);
          console.log(hash)
          // return hash.toString()
          var hashInBase64 = CryptoJS.enc.Base64.stringify(hash);
          return hashInBase64
      }

      // The header typically consists of two parts:
      // the type of the token, which is JWT, and the signing algorithm being used,
      // such as HMAC SHA256 or RSA.
      const header = {
        "alg": "HS256",
        "typ": "JWT",
        // "kid": "vpaas-magic-cookie-1fc542a3e4414a44b2611668195e2bfe/4f4910"
      }
      let encodedHeaders = btoa(JSON.stringify(header))
      encodedHeaders = Base64EncodeUrl(encodedHeaders)

      // The second part of the token is the payload, which contains the claims.
      // Claims are statements about an entity (typically, the user) and
      // additional data. There are three types of claims:
      // registered, public, and private claims.
      // let encodedPlayload = btoa(JSON.stringify(payload))
      let encodedPlayload = b64EncodeUnicode(JSON.stringify(payload))
      // let encodedPlayload = toBinary(JSON.stringify(payload))

      encodedPlayload = Base64EncodeUrl(encodedPlayload)
      // create the signature part you have to take the encoded header,
      // the encoded payload, a secret, the algorithm specified in the header,
      // and sign that.
      const signature = HMACSHA256(`${encodedHeaders}.${encodedPlayload}`, api_key)
      console.log(signature)
      // const encodedSignature = btoa(signature)
      encodedSignature = Base64EncodeUrl(signature)
      const jwt = `${encodedHeaders}.${encodedPlayload}.${encodedSignature}`
      return jwt
  }

  function b64EncodeUnicode(str) {
      // first we use encodeURIComponent to get percent-encoded UTF-8,
      // then we convert the percent encodings into raw bytes which
      // can be fed into btoa.
      // return btoa(encodeURIComponent(str));
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
          function toSolidBytes(match, p1) {
              return String.fromCharCode('0x' + p1);
      }));
  }

  function toBinary(string) {
    const codeUnits = new Uint16Array(string.length);
    for (let i = 0; i < codeUnits.length; i++) {
      codeUnits[i] = string.charCodeAt(i);
    }
    return btoa(String.fromCharCode(...new Uint8Array(codeUnits.buffer)));
  }
  </script>
